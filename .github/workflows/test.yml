name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # 测试与打包冒烟目前只在 macOS 上验证过，CI 先只跑 macOS。
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # pretest 会把 better-sqlite3 重建为当前 Node ABI；测试使用临时数据目录，不需要任何账号或密钥。
      - run: npm test
