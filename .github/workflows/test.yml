name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # pretest 会把 better-sqlite3 重建为当前 Node ABI；测试使用临时数据目录，不需要任何账号或密钥。
      - run: npm test
      - name: Smoke CLI launch (macOS)
        if: runner.os == 'macOS'
        run: npm run smoke:cli
