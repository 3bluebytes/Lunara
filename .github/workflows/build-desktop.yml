# 手动构建验收候选：Apple Silicon .dmg（含冒烟与清单审计）与 Windows x64 .exe。
# 只上传 Actions artifacts；Release 由发布者在测试和实机验收后手动创建。

name: build-desktop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: lunara-macos-arm64
            pattern: dist-desktop/*.dmg
          - os: windows-2022
            artifact: lunara-windows-x64
            pattern: dist-desktop/*.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ffmpeg-static 的二进制随 npm 包下载；GitHub 网络内无需镜像。
      - run: npm ci

      - name: Build macOS installer (arm64) with license gate & packaged smoke
        if: runner.os == 'macOS'
        run: npm run dist:mac

      - name: Audit macOS app.asar contents (no private data or dev docs)
        if: runner.os == 'macOS'
        run: |
          node -e '
            import { execFileSync } from "node:child_process";
            import assert from "node:assert/strict";
            const asar = "dist-desktop/mac-arm64/Lunara.app/Contents/Resources/app.asar";
            const list = execFileSync("npx", ["--no-install", "@electron/asar", "list", asar], { encoding: "utf8", maxBuffer: 64 * 1024 * 1024 });
            const entries = list.split(/\r?\n/).filter(Boolean);
            for (const req of ["/server/index.js", "/pwa/index.html", "/build/licenses/README-ffmpeg.md"]) {
              assert.ok(entries.includes(req), "missing required asset: " + req);
            }
            for (const bad of [/^\/\.env$/m, /^\/data\//m, /^\/cache\//m, /^\/backup\//m, /^\/docs\//m, /^\/openspec\//m, /^\/user\/taste\.md$/m]) {
              assert.ok(!bad.test(list), "forbidden entry inside app.asar: " + bad);
            }
            console.log("asar audit passed (" + entries.length + " entries)");
          ' --input-type=module

      - name: Build Windows installer (x64) with license gate
        if: runner.os == 'Windows'
        run: npm run dist:win

      - name: Audit Windows app.asar contents (no private data or dev docs)
        if: runner.os == 'Windows'
        run: |
          node -e '
            import { execFileSync } from "node:child_process";
            import assert from "node:assert/strict";
            const asar = "dist-desktop/win-unpacked/resources/app.asar";
            const list = execFileSync("npx", ["--no-install", "@electron/asar", "list", asar], { encoding: "utf8", maxBuffer: 64 * 1024 * 1024, shell: true });
            const entries = list.split(/\r?\n/).filter(Boolean);
            for (const req of ["/server/index.js", "/pwa/index.html", "/build/licenses/README-ffmpeg.md"]) {
              assert.ok(entries.includes(req), "missing required asset: " + req);
            }
            for (const bad of [/^\/\.env$/m, /^\/data\//m, /^\/cache\//m, /^\/backup\//m, /^\/docs\//m, /^\/openspec\//m, /^\/user\/taste\.md$/m]) {
              assert.ok(!bad.test(list), "forbidden entry inside app.asar: " + bad);
            }
            console.log("windows asar audit passed (" + entries.length + " entries)");
          ' --input-type=module

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.pattern }}
            dist-desktop/SHA256SUMS.txt
          if-no-files-found: error
